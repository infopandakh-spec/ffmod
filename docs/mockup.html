 return '<h3>'+t('howto')+'</h3><div class="gd">'+(G.video?'<div class="vid">&#9654; '+esc(G.video)+'</div>':'')+(tx?'<p style="white-space:pre-wrap;margin:8px 3px">'+esc(tx)+'</p>':'')+
 (G.link?'<button class="chip" style="background:#232b47">&#128279; '+esc(G.link.replace(/^https?:\/\//,''))+'</button> ':'')+(G.file?'<button>&#11015; '+esc(G.file)+'</button>':'')+'</div>'}
function account(v){v.innerHTML='<h3>'+t('account')+'</h3><div class="gd"><b>Master</b> <small>('+t('role')+')</small><div style="font-size:26px;color:#00c896;font-weight:700;margin:6px 0">'+money(S.bal)+'</div><p style="margin:4px 0;color:#9aa6d1">'+t('orders')+': '+S.orders+' · '+t('spent')+': '+money(S.spent)+'</p><button onclick="go(5)">'+t('topup')+'</button> <button onclick="go(6)" style="background:#2f3b66;color:#fff">'+t('history')+'</button></div>'}
function topup(v){v.innerHTML='<h3>'+t('topup')+'</h3><div class="gd"><p class="h">'+t('choose')+'</p><div class="ch" id="tc"></div><input class="f" id="ta" type="number" min="0.01" step="0.01" placeholder="USD" style="margin:10px 0"><button onclick="tp()">'+t('pay_khqr')+'</button><p class="why" id="tm"></p></div>';
 [1,5,10,20].forEach(function(n){var b=document.createElement('button');b.className='chip';b.textContent='$'+n;b.onclick=function(){$('ta').value=n};$('tc').appendChild(b)})}
function tp(){var a=parseFloat($('ta').value);if(!a||a<=0){$('tm').textContent=t('amt_err');return}S.bal=Math.round((S.bal+a)*100)/100;S.tx.unshift({sign:'+',amt:a,kind:'topup_tx',rec:null});go(4)}
function history(v){v.innerHTML='<h3>'+t('history')+'</h3>'+(S.tx.length?S.tx.map(function(x){return '<div class="key"><span>'+t(x.kind==='purchase'?'purchase':'topup_tx')+' · '+esc(x.rec?rtext(x.rec):'KHQR')+'</span><b style="color:'+(x.sign==='+'?'#00c896':'#ff8b8b')+'">'+x.sign+money(x.amt)+'</b></div>'}).join(''):'<p class="h">'+t('no_tx')+'</p>')}
function unitSel(id,cur){return '<select id="'+id+'">'+['Hour','Day','Month'].map(function(u){return '<option value="'+u+'"'+(u===cur?' selected':'')+'>'+t(u)+'</option>'}).join('')+'</select>'}
function admin(v){var h='<h3>'+t('a_add')+'</h3><div class="ad"><select id="ag">'+S.games.map(function(x,k){return '<option value="'+k+'">'+x.n+'</option>'}).join('')+'</select><input id="ad" type="number" min="1" placeholder="'+t('a_valid')+'">'+unitSel('au','Day')+'<input id="ap" type="number" step="0.01" placeholder="'+t('a_price')+'"><button onclick="add()">'+t('a_add_b')+'</button></div><p class="h">'+S.am+'</p><h3>'+t('a_mods')+'</h3>';
 S.games.forEach(function(g,gi){g.it.forEach(function(i,ii){var id=gi+'_'+ii;h+='<div class="ad"><b>'+g.n+' · '+lab(i)+' · '+money(i.p)+'</b><input id="d'+id+'" type="number" min="1" value="'+i.d+'">'+unitSel('u'+id,i.u)+'<input id="p'+id+'" type="number" step="0.01" value="'+i.p+'"><button style="background:#2f3b66;color:#fff" onclick="save('+gi+','+ii+')">'+t('a_save')+'</button><span class="ro">'+t('a_avail')+' '+i.k.length+'</span><textarea id="k'+id+'" rows="3" placeholder="'+esc(t('a_keys_ph'))+'" oninput="cnt(this)" style="flex:1 1 100%"></textarea><span class="ro" id="c'+id+'">0 '+t('a_ready')+'</span><button onclick="addk('+gi+','+ii+')">'+t('a_addk')+'</button><span class="ro" id="m'+id+'"></span></div>'})});
 var G=S.guide;h+='<h3>'+t('a_guide')+'</h3><div class="ad"><b>'+S.games[0].n+'</b><textarea id="gt" rows="3" placeholder="'+t('a_text')+'" style="flex:1 1 100%">'+esc(G.text==='g'?t('g_text'):G.text)+'</textarea><input id="gl" placeholder="'+t('a_link')+'" value="'+esc(G.link)+'" style="flex:1 1 100%"><input id="gv" placeholder="'+t('a_video')+'" value="'+esc(G.video)+'" style="flex:1 1 100%"><input id="gf" placeholder="'+t('a_file')+'" value="'+esc(G.file)+'" style="flex:1 1 100%"><button onclick="sg()">'+t('a_saveg')+'</button><span class="ro">'+S.gm+'</span></div>';
 v.innerHTML=h}
function add(){var d=parseInt($('ad').value),p=parseFloat($('ap').value);if(!d||d<1||isNaN(p)){S.am=t('a_need');draw();return}
 S.games[+$('ag').value].it.push({d:d,u:$('au').value,p:p,k:[]});S.am=t('a_added');draw()}
function save(g,i){var x=S.games[g].it[i],d=parseInt($('d'+g+'_'+i).value),p=parseFloat($('p'+g+'_'+i).value);if(!d||isNaN(p))return;x.d=d;x.u=$('u'+g+'_'+i).value;x.p=p;draw()}
function cnt(e){var n=e.value.split(/\r?\n/).filter(function(x){return x.trim()}).length;e.nextElementSibling.textContent=n+' '+t('a_ready')}
function addk(g,i){var it=S.games[g].it[i],L=[],seen={},id=g+'_'+i;
 $('k'+id).value.split(/\r?\n/).forEach(function(x){x=x.trim();if(x&&!seen[x]){seen[x]=1;L.push(x)}});
 if(!L.length){$('m'+id).textContent=t('a_paste');return}
 var a=0;L.forEach(function(x){if(it.k.indexOf(x)<0){it.k.push(x);a++}});
 var msg=t('a_addedk',{a:a,l:L.length})+(L.length>a?t('a_skip',{s:L.length-a}):'');draw();$('m'+id).textContent=msg}
function sg(){S.guide={text:$('gt').value,link:$('gl').value.trim(),video:$('gv').value.trim(),file:$('gf').value.trim()};S.gm=t('a_gsaved');draw()}
draw();
</script></body></html>
